title: Alan Bellon
email: alan.bellon.00@gmail.com
name: Alan Bellon
description: Blog personal de Alan Bellon sobre tecnología y desarrollo.

keywords: [Blog, Alan Bellon, 123porAlan, Computer Science, Testing, Automation, Python]
baseurl: ""
url: "https://123poralan.com"
domain: "123poralan.com"
language: en # Cambia a 'es' si escribes mayormente en español

analytics: # Tu ID de Google Analytics si tienes uno (UA-XXXXX-Y o G-XXXXX)

# --- Configuración de Paginación ---
paginate: 10  # Muestra 5 posts por página (útil para ver la paginación funcionar pronto)
paginate_path: "/page:num/"

comments: false
disqus: # Tu cuenta disqus si decides activarlo

mathjax: true
mermaid: false

permalink: /:title

sass:
  sass_dir: _sass
  style: compressed

# Category settings
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalinks:
    category: /category/:name/
    tag: /tag/:name/

# Build settings
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-paginate  # ¡Importante! Este es el motor de la paginación
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-seo-tag
